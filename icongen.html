<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Leon Icon Generator</title></head>
<body style="background:#0d0d14;color:#cdd6f4;font-family:sans-serif;text-align:center;padding:30px;">
  <h2>A.P. Leon PWA Icon Generator</h2>
  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512" style="width:192px;height:192px;"></canvas><br><br>
  <button onclick="dl('c192','icon-192.png')">Download icon-192.png</button>
  <button onclick="dl('c512','icon-512.png')">Download icon-512.png</button>
<script>
function draw(id){
  const c=document.getElementById(id), g=c.getContext('2d'), s=c.width/512;
  g.fillStyle='#181825'; g.fillRect(0,0,c.width,c.height);
  g.scale(s,s);
  g.fillStyle='#89B4FA'; g.beginPath(); g.roundRect(136,160,240,220,48); g.fill();
  g.fillStyle='#B4BEFE'; g.beginPath(); g.roundRect(146,110,220,140,42); g.fill();
  g.fillStyle='#11111B';
  g.beginPath(); g.ellipse(268,180,18,24,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(324,180,18,24,0,0,Math.PI*2); g.fill();
  g.fillStyle='#45475A';
  g.beginPath(); g.roundRect(166,370,70,48,16); g.roundRect(276,370,70,48,16); g.fill();
}
function dl(id,name){const a=document.createElement('a');a.download=name;a.href=document.getElementById(id).toDataURL();a.click();}
draw('c192'); draw('c512');
</script>
</body>
</html>
